[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fogmap"
description = "A fog-of-war map tool for tabletop games."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
	"lxml>=6.1",
	"numpy>=2.0",
	"pillow>=12.0",
	"wxPython>=4.3",
]

[project.scripts]
fogmap = "fogmap.app:main"

[tool.setuptools.dynamic]
version = {attr = "fogmap.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fogmap.resources" = ["*.png", "*.ico", "*.icns", "icons/*.svg"]
